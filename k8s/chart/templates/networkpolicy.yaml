{{- with .Values.networkPolicy }}
{{- if .enabled }}
{{- if not .from }}
{{- fail "networkPolicy.from is required when networkPolicy.enabled is true" }}
{{- end }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "githoney-bot.fullname" $ }}
  namespace: {{ $.Release.Namespace }}
  labels:
    {{- include "githoney-bot.labels" $ | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "githoney-bot.selectorLabels" $ | nindent 6 }}
  policyTypes:
    - Ingress
  # Only the listed peers reach the bot's port; egress is not restricted.
  ingress:
    - from:
        {{- toYaml .from | nindent 8 }}
      ports:
        - port: http
          protocol: TCP
{{- end }}
{{- end }}
